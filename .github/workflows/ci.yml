name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, dev, wip]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # the VSIX version is the commit count

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AiDevHelpers.slnx

      - name: Build
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild.exe was not found.' }
          & $msbuild AiDevHelpers.slnx /t:Build /p:Configuration=Release /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install procdump for crash dumps
        run: choco install procdump --yes --no-progress

      - name: Point the Blame collector at procdump
        shell: pwsh
        run: |
          # Chocolatey's PATH change is not visible to later steps, so the Blame collector cannot find procdump64.exe.
          $exe = (Get-Command procdump64.exe -ErrorAction SilentlyContinue).Source
          if (-not $exe) {
            $exe = Get-ChildItem 'C:\ProgramData\chocolatey' -Recurse -Filter procdump64.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw 'procdump64.exe was not found after install.' }
          "PROCDUMP_PATH=$(Split-Path $exe)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "procdump at $exe"

      - name: Test
        run: dotnet test AiDevHelpers.slnx -c Release --no-build --filter "Category!=Tpm&Category!=Admin&Category!=Manual" --blame-crash --blame-crash-dump-type full

      - name: Upload crash evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-crash-evidence
          path: |
            **/TestResults/**
            **/*.dmp
          if-no-files-found: ignore

      - name: Install VSSDK
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' -property installationPath
          if (-not $install) { throw 'No Visual Studio installation was found on the runner.' }
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          & $installer modify --installPath $install --add Microsoft.VisualStudio.Component.VSSDK --quiet --norestart --wait
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }

      - name: Build VSIX
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & pwsh -NoProfile -File scripts/build-vs-extension-vsix.ps1 -MSBuildPath $msbuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aidevhelpers-vs-vsix
          path: src/Installers/Vs2026/Installer/src/AiDevHelpers.Installers.Vs2026.Installer.vsix

  vscode-extension:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Core lint and tests
        working-directory: src/Installers/VsCode/Core/AiDevTools.VsCode.Core
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build, lint and test the extension
        working-directory: src/Installers/VsCode/Installer/AiDevTools.VsCode
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

      - name: Package the VSIX for VS Code
        working-directory: src/Installers/VsCode/Installer/AiDevTools.VsCode
        run: npm run package

      - name: Upload VS Code extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aidevhelpers-vscode-extension
          path: src/Installers/VsCode/Installer/AiDevTools.VsCode/aidevhelpers-vscode.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Bridge/src/AiDevHelpers.Bridge.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/MCP/Core/src/AiDevHelpers.MCP.Core.csproj -c Release -o artifacts -p:Version="$VERSION"
          # Helpers ship as their own packages. Common first: four helpers depend on it. LogHelper next: ErrorHelper depends on it.
          dotnet pack src/Common/src/AiDevHelpers.Common.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/LogHelper/src/AiDevHelpers.Helpers.LogHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/ConfigHelper/src/AiDevHelpers.Helpers.ConfigHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/ErrorHelper/src/AiDevHelpers.Helpers.ErrorHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/ExtensionsHelper/src/AiDevHelpers.Helpers.ExtensionsHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/TestingHelper/src/AiDevHelpers.Helpers.TestingHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/BookmarkHelper/src/AiDevHelpers.Helpers.BookmarkHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          # LintHelper depends on LocalizationHelper, so LocalizationHelper packs first.
          dotnet pack src/Helpers/LocalizationHelper/src/AiDevHelpers.Helpers.LocalizationHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/LintHelper/src/AiDevHelpers.Helpers.LintHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/SourceControlHelper/src/AiDevHelpers.Helpers.SourceControlHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/OutputHelper/src/AiDevHelpers.Helpers.OutputHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/PackageHelper/src/AiDevHelpers.Helpers.PackageHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/GateHelper/src/AiDevHelpers.Helpers.GateHelper.csproj -c Release -o artifacts -p:Version="$VERSION"
          dotnet pack src/Helpers/ProjectHelper/src/AiDevHelpers.Helpers.ProjectHelper.csproj -c Release -o artifacts -p:Version="$VERSION"

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/AiDevHelpers/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
